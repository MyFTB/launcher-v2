version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      electron:
        patterns:
          - "electron"
          - "electron-*"
        update-types: ["minor", "patch"]
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
        update-types: ["minor", "patch"]
      vite:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "electron-vite"
        update-types: ["minor", "patch"]
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: ["minor", "patch"]
      typescript-tooling:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "eslint"
          - "globals"
          - "@types/node"
        update-types: ["minor", "patch"]
      xmcl:
        patterns:
          - "@xmcl/*"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
