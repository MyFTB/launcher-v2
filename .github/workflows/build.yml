name: Build

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm 12.0.2
        run: npm install --global npm@12.0.2

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Validate dependency tree
        run: npm ls --all

      - name: Prepare Electron binary
        run: npm run prepare:electron

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit:production

      - name: Audit all dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit:full

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: npm run test

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Package smoke test (no publish)
        run: npm run package -- --dir --publish never
