name: CodeQL

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "scripts/**"
      - "electron.vite.config.ts"
      - "eslint.config.mjs"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "scripts/**"
      - "electron.vite.config.ts"
      - "eslint.config.mjs"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 7 * * 1"

jobs:
  analyze:
    name: Analyze (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              - out
              - dist
              - node_modules

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Validate dependency tree
        run: npm ls --all

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
