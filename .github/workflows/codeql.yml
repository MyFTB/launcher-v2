# CodeQL security analysis
# Scans TypeScript/JavaScript for security vulnerabilities and code quality issues.
# Runs on every push to main, every PR, and weekly for historical scans.

name: CodeQL

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "package.json"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
  schedule:
    # Weekly scan every Monday at 07:00 UTC
    - cron: "0 7 * * 1"

# Opt into Node.js 24 for action runners (becomes default June 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze (TypeScript)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: javascript-typescript
          # Use the default security-and-quality query suite
          queries: security-and-quality
          # Exclude build output and dependencies — CodeQL analyses TS source directly
          config: |
            paths-ignore:
              - out
              - dist
              - node_modules

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          category: "/language:javascript-typescript"

