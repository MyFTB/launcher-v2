name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-channel:
    name: Resolve update channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Select stable or experimental channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "channel=experimental" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi

  quality-gate:
    name: Release quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Validate dependency tree
        run: npm ls --all

      - name: Prepare Electron binary
        run: npm run prepare:electron

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Audit all dependencies
        run: npm run audit:full

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Package smoke test (no publish)
        run: npm run package -- --dir --publish never

  release-preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Verify tag matches package.json
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}" >&2
            exit 1
          fi
          echo "Verified ${GITHUB_REF_NAME} == package.json ${package_version}"

  build-windows:
    name: Build — Windows
    runs-on: windows-latest
    needs: [resolve-channel, quality-gate, release-preflight]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Validate dependency tree
        run: npm ls --all

      - name: Prepare Electron binary
        run: npm run prepare:electron

      - name: Package and publish unsigned Windows installer
        run: npm run package:win -- --publish always --config.publish.channel="${{ needs.resolve-channel.outputs.channel }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Windows update metadata
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          file="dist/${CHANNEL}.yml"
          test -f "$file" || { echo "Expected Windows update metadata $file was not generated" >&2; exit 1; }
          grep -Eq "^version: ['\"]?${version}['\"]?$" "$file" || { echo "Metadata version mismatch in $file" >&2; exit 1; }
          grep -Eq '^path: .+' "$file" || { echo "Missing artifact path in $file" >&2; exit 1; }
          grep -Eq '^sha512: .+' "$file" || { echo "Missing sha512 in $file" >&2; exit 1; }

  build-macos:
    name: Build — macOS
    runs-on: macos-latest
    needs: [resolve-channel, quality-gate, release-preflight]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Validate dependency tree
        run: npm ls --all

      - name: Prepare Electron binary
        run: npm run prepare:electron

      - name: Package and publish unsigned macOS installer
        run: npm run package:mac -- --publish always --config.publish.channel="${{ needs.resolve-channel.outputs.channel }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify macOS update metadata
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          file="dist/${CHANNEL}-mac.yml"
          test -f "$file" || { echo "Expected macOS update metadata $file was not generated" >&2; exit 1; }
          grep -Eq "^version: ['\"]?${version}['\"]?$" "$file" || { echo "Metadata version mismatch in $file" >&2; exit 1; }
          grep -Eq '^path: .+' "$file" || { echo "Missing artifact path in $file" >&2; exit 1; }
          grep -Eq '^sha512: .+' "$file" || { echo "Missing sha512 in $file" >&2; exit 1; }

  build-linux:
    name: Build — Linux
    runs-on: ubuntu-latest
    needs: [resolve-channel, quality-gate, release-preflight]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Validate dependency tree
        run: npm ls --all

      - name: Prepare Electron binary
        run: npm run prepare:electron

      - name: Package and publish Linux installers
        run: npm run package:linux -- --publish always --config.publish.channel="${{ needs.resolve-channel.outputs.channel }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Generate Linux checksums and SBOM
        env:
          CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="dist/${CHANNEL}-linux.yml"
          test -f "$file" || { echo "Expected Linux update metadata $file was not generated" >&2; exit 1; }
          grep -Eq "^version: ['\"]?${version}['\"]?$" "$file" || { echo "Metadata version mismatch in $file" >&2; exit 1; }
          grep -Eq '^path: .+' "$file" || { echo "Missing artifact path in $file" >&2; exit 1; }
          grep -Eq '^sha512: .+' "$file" || { echo "Missing sha512 in $file" >&2; exit 1; }
          find dist -maxdepth 1 -type f ! -name SHA256SUMS.txt ! -name SBOM.cdx.json -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt
          npm sbom --sbom-format cyclonedx --sbom-type application > dist/SBOM.cdx.json

      - name: Upload Linux checksums and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ github.ref_name }}
          path: |
            dist/SHA256SUMS.txt
            dist/SBOM.cdx.json
          if-no-files-found: error

      - name: Attest Linux packages, checksums, and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*-linux.yml
            dist/SHA256SUMS.txt
            dist/SBOM.cdx.json

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-channel, quality-gate, release-preflight, build-windows, build-macos, build-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download Linux checksums and SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-${{ github.ref_name }}
          path: release-assets/linux

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit CHANGELOG.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet && echo "No changes to CHANGELOG.md" && exit 0
          git commit -m "docs: update CHANGELOG.md for ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Publish GitHub Release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          prerelease_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --title "MyFTB Launcher ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              "${prerelease_args[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "MyFTB Launcher ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              "${prerelease_args[@]}"
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          ((${#assets[@]})) || { echo "No release assets were downloaded" >&2; exit 1; }
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
